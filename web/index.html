<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expelled!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <div id="join-screen" class="overlay">
    <form id="join-form" class="card" novalidate>
      <h1>Expelled!</h1>
      <p class="subtitle">Live campus test: walk around with WASD or the arrow keys.</p>
      <label for="nickname">Nickname</label>
      <input id="nickname" name="nickname" type="text" maxlength="16" autocomplete="off"
             placeholder="1–16 letters, digits, spaces" autofocus>
      <button id="join-button" type="submit">Join</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="hud" hidden>
    <span id="area-name"></span>
    <span id="player-count"></span>
    <span class="hint">WASD / arrow keys to move</span>
  </div>

  <div id="lobby" class="panel" hidden>
    <h2>Lobby</h2>
    <ul id="lobby-players"></ul>
    <button id="start-button" type="button" hidden>Start game</button>
    <p id="start-hint" class="hint"></p>
  </div>

  <div id="role-badge" class="panel" hidden></div>

  <div id="role-screen" class="overlay" hidden>
    <div class="card role-card">
      <h2 id="role-title"></h2>
      <p id="role-detail"></p>
    </div>
  </div>

  <div id="actions">
    <button id="report-button" type="button" hidden>Report failed exam (R)</button>
    <button id="bell-button" type="button" hidden>Ring the bell</button>
    <button id="expel-button" type="button" hidden>Expel (E)</button>
  </div>

  <div id="ghost-banner" class="banner" role="status" hidden>
    <strong id="ghost-title">You have been expelled</strong>
    You are a ghost now: keep walking, the living cannot see you.
  </div>

  <div id="meeting-screen" class="overlay" hidden>
    <div class="card meeting-card">
      <div class="meeting-head">
        <h2 id="meeting-title">Meeting</h2>
        <span id="meeting-timer" class="timer" aria-label="Seconds left"></span>
      </div>
      <p id="meeting-reason"></p>
      <ul id="meeting-players"></ul>
      <button id="skip-button" type="button">Skip vote</button>
      <p id="meeting-status" role="status"></p>
    </div>
  </div>

  <div id="end-screen" class="overlay" hidden>
    <div class="card end-card">
      <h2 id="end-title"></h2>
      <ul id="end-roles"></ul>
      <button id="restart-button" type="button" hidden>New round</button>
      <p id="restart-hint" class="hint"></p>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="disconnected" class="overlay" hidden>
    <div class="card">
      <h2>Connection lost</h2>
      <p>The server closed the connection.</p>
      <button type="button" onclick="location.reload()">Reload and rejoin</button>
    </div>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>
</html>
